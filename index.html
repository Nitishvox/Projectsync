    <script>
      // Gracefully handle Vite dev HMR websocket closure in sandboxed container preview
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
